service: hackathon-backend

provider:
  name: aws
  runtime: java21
  region: ap-northeast-2
  memorySize: 1024
  timeout: 30
  environment:
    SPRING_PROFILES_ACTIVE: prod
    RDS_ENDPOINT: ${env:RDS_ENDPOINT}
    RDS_USERNAME: ${env:RDS_USERNAME}
    RDS_PASSWORD: ${env:RDS_PASSWORD}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    SEOUL_CULTURE_API_KEY: ${env:SEOUL_CULTURE_API_KEY}

functions:
  api:
    handler: com.example.hackathon.HackathonApplication::handleRequest
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

plugins:
  - serverless-java-container

custom:
  serverless-java-container:
    artifact: build/libs/*.jar

# =============================================================================
# 해커톤 프로젝트 - Spring Boot 애플리케이션 설정
# =============================================================================

# =============================================================================
# 프로파일 설정
# =============================================================================
# 기본 프로파일: local (application-local.properties 파일 사용)
spring.profiles.active=local

# =============================================================================
# 데이터베이스 설정 (MySQL)
# =============================================================================
# MySQL 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/hackathon_db?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA 설정
# =============================================================================
# Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 한글 인코딩 설정
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.CharSet=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true

# =============================================================================
# 로깅 설정
# =============================================================================
# 서비스 레벨 디버그 로깅
logging.level.com.example.hackathon.service=DEBUG
logging.level.org.jsoup=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# 한글 인코딩 설정
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# 로그 패턴 설정 (한글 깨짐 방지)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# =============================================================================
# 서버 설정
# =============================================================================
# 포트 및 인코딩 설정
server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =============================================================================
# 외부 API 설정
# =============================================================================
# 서울시 문화행사 API 키
seoul.culture.api.key=${SEOUL_CULTURE_API_KEY:}

# OpenAI API 설정
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}
openai.max-tokens=${OPENAI_MAX_TOKENS:300}
openai.temperature=${OPENAI_TEMPERATURE:0.3}

# =============================================================================
# 크롤링 설정
# =============================================================================
# 크롤링 활성화 여부
crawler.enabled=true

# 요청 간 지연시간 설정 (초) - 더 안전하게 조정
crawler.min-delay-seconds=3
crawler.max-delay-seconds=8

# 크롤링 제한 설정 - 더 보수적으로 조정
crawler.max-reviews-per-request=10
crawler.max-daily-requests=50

# 타임아웃 및 재시도 설정 - 더 안전하게 조정
crawler.timeout-seconds=20
crawler.max-retries=2
crawler.retry-delay-seconds=15

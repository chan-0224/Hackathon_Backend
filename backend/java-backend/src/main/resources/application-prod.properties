# =============================================================================
# AWS 프로덕션 환경 설정
# =============================================================================

# =============================================================================
# 데이터베이스 설정 (AWS RDS MySQL)
# =============================================================================
# RDS 엔드포인트는 AWS 콘솔에서 확인 후 설정
spring.datasource.url=jdbc:mysql://${RDS_ENDPOINT}:3306/hackathon_db?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&useSSL=true&requireSSL=false
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA 설정
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 한글 인코딩 설정
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.CharSet=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true

# =============================================================================
# 서버 설정
# =============================================================================
# 포트 설정 (AWS ELB나 ALB에서 80/443으로 포워딩)
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =============================================================================
# 로깅 설정
# =============================================================================
# 프로덕션에서는 INFO 레벨로 설정
logging.level.com.example.hackathon=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# 로그 파일 설정
logging.file.name=/var/log/hackathon/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# =============================================================================
# 외부 API 설정
# =============================================================================
# 환경변수에서 API 키 로드
seoul.culture.api.key=${SEOUL_CULTURE_API_KEY}
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}
openai.max-tokens=${OPENAI_MAX_TOKENS:300}
openai.temperature=${OPENAI_TEMPERATURE:0.3}

# =============================================================================
# 크롤링 설정 (프로덕션에서는 보수적으로)
# =============================================================================
crawler.enabled=true
crawler.min-delay-seconds=5
crawler.max-delay-seconds=10
crawler.max-reviews-per-request=5
crawler.max-daily-requests=20
crawler.timeout-seconds=30
crawler.max-retries=3
crawler.retry-delay-seconds=20

# =============================================================================
# 보안 설정
# =============================================================================
# CORS 설정 (프론트엔드 도메인 허용)
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://your-frontend-domain.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

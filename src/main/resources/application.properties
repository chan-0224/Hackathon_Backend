# MySQL Database Configuration (환경변수 또는 application-local.properties에서 설정)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hackathon_db?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8081

# API Keys (환경변수 또는 application-local.properties에서 설정)
seoul.culture.api.key=${SEOUL_CULTURE_API_KEY:sample}
chatgpt.api.key=${CHATGPT_API_KEY:YOUR_API_KEY_HERE}
